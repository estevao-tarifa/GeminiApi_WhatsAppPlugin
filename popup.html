<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Text Enhancer</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input[type="text"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .save-btn {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .save-btn:hover {
      background-color: #128C7E;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>WhatsApp Text Enhancer</h2>
    
    <div class="input-group">
      <label for="apiKey">Chave da API Gemini:</label>
      <input type="text" id="apiKey" placeholder="Cole sua chave API aqui">
    </div>

    <button class="save-btn" id="saveButton">Salvar Configurações</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
